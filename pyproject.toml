[project]
name = "candy-store"
version = "0.1.0"
description = "Plataforma omnicanal para comercio de golosinas (POS + e-commerce) con inventario FEFO"
readme = "README.md"
authors = [
    { name = "Juan Tevez", email = "juan.tevez@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "W291"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requiere PostgreSQL (docker compose up -d)"]

[tool.importlinter]
root_package = "candy_store"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal: infrastructure -> application -> domain"
type = "layers"
layers = ["infrastructure", "application", "domain"]
containers = [
    "candy_store.shared",
    "candy_store.catalog",
    "candy_store.inventory",
    "candy_store.purchasing",
    "candy_store.sales",
]

[[tool.importlinter.contracts]]
name = "Bounded contexts are independent (except via each context's public API)"
type = "independence"
modules = [
    "candy_store.catalog",
    "candy_store.inventory",
    "candy_store.purchasing",
    "candy_store.sales",
]
# Única excepción: el adaptador (ACL) de sales puede usar la API pública de inventory.
ignore_imports = [
    "candy_store.sales.infrastructure.inventory.** -> candy_store.inventory.public",
]

[[tool.importlinter.contracts]]
name = "Other contexts only see inventory through inventory.public"
type = "forbidden"
source_modules = ["candy_store.catalog", "candy_store.purchasing", "candy_store.sales"]
forbidden_modules = [
    "candy_store.inventory.domain",
    "candy_store.inventory.application",
    "candy_store.inventory.infrastructure",
]
# public.py usa internamente la capa de aplicación; eso es un detalle de inventory.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Shared kernel does not depend on bounded contexts"
type = "forbidden"
source_modules = ["candy_store.shared"]
forbidden_modules = [
    "candy_store.catalog",
    "candy_store.inventory",
    "candy_store.purchasing",
    "candy_store.sales",
]

[[tool.importlinter.contracts]]
name = "Domain and application are framework-free"
type = "forbidden"
source_modules = [
    "candy_store.shared.domain",
    "candy_store.shared.application",
    "candy_store.catalog.domain",
    "candy_store.catalog.application",
    "candy_store.inventory.domain",
    "candy_store.inventory.application",
    "candy_store.purchasing.domain",
    "candy_store.purchasing.application",
    "candy_store.sales.domain",
    "candy_store.sales.application",
]
forbidden_modules = [
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "pydantic",
    "pydantic_settings",
    "fastapi",
    "starlette",
    "uvicorn",
]
